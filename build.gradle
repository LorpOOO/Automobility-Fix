plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.112'
}

version = "${mod_version}+${minecraft_version}-neoforge"
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven {
        name = "FTB"
        url = "https://maven.ftb.dev/releases"
        content { includeGroup "dev.ftb.mods" }
    }
    maven {
        name = "Architectury"
        url = "https://maven.architectury.dev/"
        content { includeGroup "dev.architectury" }
    }
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

neoForge {
    version = project.neoforge_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }
        client2 {
            client()
            gameDirectory = project.file('run-client2')
            programArguments.addAll '--username', 'Player2'
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    implementation "maven.modrinth:automobility:${automobility_version}"
    compileOnly "maven.modrinth:open-parties-and-claims:${opac_version}"
    compileOnly("dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}") { transitive = false }
    compileOnly("dev.ftb.mods:ftb-chunks-neoforge:${ftb_chunks_version}") { transitive = false }

    // Optional mods for testing in the dev runs
    runtimeOnly "maven.modrinth:open-parties-and-claims:${opac_version}"
    runtimeOnly("dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}") { transitive = false }
    runtimeOnly("dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}") { transitive = false }
    runtimeOnly("dev.architectury:architectury-neoforge:${architectury_version}") { transitive = false }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('processResources', ProcessResources) {
    def props = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') {
        expand props
    }
}
